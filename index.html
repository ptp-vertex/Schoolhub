<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อัปเดตระบบ - SchoolHub</title>
    
    <meta http-equiv="refresh" content="0; url=https://ptp-vertex.github.io/Schoolhub-TH/">
    
    <style>
        body {
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8fafc;
            color: #334155;
            text-align: center;
            margin: 0;
        }
        .container {
            padding: 2.5rem;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 90%;
            width: 400px;
        }
        .spinner {
            border: 4px solid #f1f5f9;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin-top: 0;
            color: #0f172a;
            font-size: 1.25rem;
        }
        p {
            font-size: 0.95rem;
            color: #64748b;
        }
        a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
            padding: 0.5rem 1rem;
            background-color: #eef2ff;
            border-radius: 0.5rem;
            display: inline-block;
            margin-top: 0.5rem;
        }
        a:hover {
            background-color: #e0e7ff;
        }
    </style>

    <script>
        // ใช้ replace เพื่อไม่ให้หน้าเก่าค้างอยู่ในประวัติการกดปุ่ม Back ของเบราว์เซอร์
        window.location.replace("https://ptp-vertex.github.io/Schoolhub-TH/");
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>กำลังย้ายไปยังระบบใหม่...</h2>
        <p>เนื่องจากหน้าเว็บนี้ยกเลิกการใช้งานแล้ว ระบบจะพาคุณไปยังหน้าใหม่โดยอัตโนมัติ</p>
        <p style="font-size: 0.85rem; margin-top: 1.5rem;">
            หากเบราว์เซอร์ไม่เปลี่ยนหน้าให้<br>
            <a href="https://ptp-vertex.github.io/Schoolhub-TH/">คลิกที่นี่เพื่อเข้าสู่ระบบใหม่</a>
        </p>
    </div>
</body>
</html>
